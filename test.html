<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>円を描いて回る赤い丸</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #f7f7f5;
      }
      #orbit {
        position: relative;
        width: min(60vw, 360px);
        aspect-ratio: 1;
        border: 2px dashed #d8d8d3;
        border-radius: 50%;
      }
      #circle {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: #e31b23;
        box-shadow: 0 10px 28px rgb(227 27 35 / 28%);
        will-change: transform;
      }
    </style>
  </head>
  <body>
    <div id="orbit">
      <div id="circle" aria-label="円を描いて回る赤い丸"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
