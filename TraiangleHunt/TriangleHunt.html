<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Triangle Hunt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+JP:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand" aria-label="Triangle Hunt">
        <span class="brand-mark"><i></i><i></i><i></i></span>
        <span>TRIANGLE<br><b>HUNT</b></span>
      </div>

      <section class="target-card" aria-label="探す三角形">
        <div class="target-copy"><span>FIND THIS</span><strong id="targetName">SHARP</strong><small>これと同じ色と形を探して</small></div>
        <canvas id="targetCanvas" width="120" height="82"></canvas>
      </section>

      <section class="stats" aria-label="ゲーム情報">
        <div class="stat"><span>STAGE</span><strong id="stageValue">01</strong></div>
        <div class="stat"><span>SCORE</span><strong id="scoreValue">0000</strong></div>
        <div class="timer" id="timerBox">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6M12 2v3"/></svg>
          <div><span>TIME</span><strong id="timeValue">30.0</strong></div>
        </div>
        <button class="hint-button" id="hintButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 22h4M8.6 15.5C7.6 14.6 7 13.2 7 11.7a5 5 0 0 1 10 0c0 1.5-.6 2.9-1.6 3.8-.7.7-1 1.1-1 2h-4c0-.9-.3-1.3-1.8-2z"/></svg>
          <span>HINT <b id="hintCount">× 3</b></span>
        </button>
      </section>
    </header>

    <section class="play-area" id="playArea">
      <canvas id="gameCanvas"></canvas>
      <div class="instruction" id="instruction">見つけた三角形をクリック</div>
      <div class="toast" id="toast" role="status"></div>
      <div class="hint-ring" id="hintRing"></div>
    </section>

    <div class="modal show" id="startModal">
      <div class="modal-card">
        <div class="modal-icon"><span></span></div>
        <p class="eyebrow">VISUAL PUZZLE</p>
        <h1>見つけられる？</h1>
        <p>たくさんの三角形に紛れた、<br>お題と同じ色・形の三角形を探そう。</p>
        <div class="rules"><span>誤クリック <b>−3秒</b></span><span>ヒント <b>3回</b></span></div>
        <button id="startButton" type="button">ゲームスタート <span>→</span></button>
      </div>
    </div>

    <div class="modal" id="gameoverModal">
      <div class="modal-card compact">
        <p class="eyebrow">TIME UP</p>
        <h1>ナイスハント！</h1>
        <p>到達ステージ <b id="finalStage">1</b>　スコア <b id="finalScore">0</b></p>
        <button id="retryButton" type="button">もう一度 <span>↻</span></button>
      </div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
